[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alg-qa-agent"
version = "0.1.0"
description = "Algorithm QA knowledge governance platform and agent runtime"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "elasticsearch>=8.13,<9",
  "fastapi>=0.115,<1",
  "filetype>=1.2,<2",
  "httpx>=0.27,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.0,<2",
  "neo4j>=5.14,<6",
  "openai>=1.51,<2",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/app/scripts/merchant_seed_data.py" = ["E501"]
