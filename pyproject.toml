[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alg-qa-agent"
version = "0.1.0"
description = "Algorithm QA knowledge governance platform and agent runtime"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "elasticsearch>=8.13,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.51,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/app/scripts/merchant_seed_data.py" = ["E501"]
