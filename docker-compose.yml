services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alg_qa
      POSTGRES_USER: alg_qa
      POSTGRES_PASSWORD: alg_qa_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alg_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://alg_qa:alg_qa_dev@postgres:5432/alg_qa
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELASTICSEARCH: "true"
      AGENT_EXECUTION_MODE: celery
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_CHAT_MODEL: ${BAILIAN_CHAT_MODEL:-qwen-plus}
      BAILIAN_EMBEDDING_MODEL: ${BAILIAN_EMBEDDING_MODEL:-text-embedding-v3}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://alg_qa:alg_qa_dev@postgres:5432/alg_qa
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELASTICSEARCH: "true"
      AGENT_EXECUTION_MODE: celery
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_CHAT_MODEL: ${BAILIAN_CHAT_MODEL:-qwen-plus}
      BAILIAN_EMBEDDING_MODEL: ${BAILIAN_EMBEDDING_MODEL:-text-embedding-v3}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  postgres_data:
  es_data:
